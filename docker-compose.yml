services:
  db:
    image: mysql:8.4
    container_name: scottshelf-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mangass}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - scottshelf-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scottshelf-app
    init: true
    pids_limit: 512
    shm_size: "1gb"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4174
      CHAPTER_TIMING: ${CHAPTER_TIMING:-0}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mangass}
      BOOKMARK_DOWNLOAD_WORKER: ${BOOKMARK_DOWNLOAD_WORKER:-1}
      BOOKMARK_DOWNLOAD_WORKER_CONCURRENCY: ${BOOKMARK_DOWNLOAD_WORKER_CONCURRENCY:-1}
      BOOKMARK_DOWNLOAD_BATCH_SIZE: ${BOOKMARK_DOWNLOAD_BATCH_SIZE:-1}
      BOOKMARK_DOWNLOAD_INTERVAL_MS: ${BOOKMARK_DOWNLOAD_INTERVAL_MS:-15000}
      BOOKMARK_DOWNLOAD_BACKFILL_ON_START: ${BOOKMARK_DOWNLOAD_BACKFILL_ON_START:-1}
      BOOKMARK_LATEST_CHECK_INTERVAL_MS: ${BOOKMARK_LATEST_CHECK_INTERVAL_MS:-600000}
      BOOKMARK_LATEST_CHECK_WORKER_CONCURRENCY: ${BOOKMARK_LATEST_CHECK_WORKER_CONCURRENCY:-4}
      BOOKMARK_LATEST_CHECK_BATCH_SIZE: ${BOOKMARK_LATEST_CHECK_BATCH_SIZE:-4}
      BOOKMARK_COMMENT_REFRESH_INTERVAL_MS: ${BOOKMARK_COMMENT_REFRESH_INTERVAL_MS:-86400000}
      BOOKMARK_COMMENT_WORKER_CONCURRENCY: ${BOOKMARK_COMMENT_WORKER_CONCURRENCY:-4}
      BOOKMARK_COMMENT_WORKER_BATCH_SIZE: ${BOOKMARK_COMMENT_WORKER_BATCH_SIZE:-1}
      BOOKMARK_COMMENT_WORKER_INTERVAL_MS: ${BOOKMARK_COMMENT_WORKER_INTERVAL_MS:-1000}
      BOOKMARK_COMMENT_PAGE_LIMIT: ${BOOKMARK_COMMENT_PAGE_LIMIT:-20}
      BOOKMARK_COMMENT_FETCH_ALL: ${BOOKMARK_COMMENT_FETCH_ALL:-1}
      BOOKMARK_COMMENT_MAX_COMMENTS_PER_THREAD: ${BOOKMARK_COMMENT_MAX_COMMENTS_PER_THREAD:-200}
      BOOKMARK_DOWNLOAD_STALE_JOB_TIMEOUT_MS: ${BOOKMARK_DOWNLOAD_STALE_JOB_TIMEOUT_MS:-1200000}
      BOOKMARK_DOWNLOAD_PROGRESS_LOG: ${BOOKMARK_DOWNLOAD_PROGRESS_LOG:-0}
      BOOKMARK_DOWNLOAD_PROGRESS_INTERVAL_MS: ${BOOKMARK_DOWNLOAD_PROGRESS_INTERVAL_MS:-30000}
      COMIX_RENDERED_BROWSER_CONCURRENCY: ${COMIX_RENDERED_BROWSER_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:4184:4174"
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: scottshelf-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - app

volumes:
  scottshelf-db-data:
